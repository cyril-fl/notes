name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-go
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: notes_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # What `make test` reads from .env. No Silo: the tests use silo.NewMemory().
    env:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notes_test
      POSTGRES_HOST: localhost
      PORT: 5432
      NOTES_SECRET: dGVzdCBrZXkgb2YgdGhlIENJLCBub3QgYSBzZWNyZXQ=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: notes-go/go.mod
          cache-dependency-path: notes-go/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -p 1: the packages share the test base, see `make test`.
      - run: CONFIG_FILE=$PWD/config/config.yaml go test -p 1 ./...

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: notes-app/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      # --bun: nuxt runs on Bun instead of Node, a bit faster.
      - run: bun --bun run typecheck
      - run: bun --bun run build

  # The stack of `make up`, from the same compose file: the e2e helpers reach its containers (note-api, note-postgres).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: notes-go/go.mod
          cache-dependency-path: notes-go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: notes-app/package.json
      - run: bun install --frozen-lockfile
        working-directory: notes-app
      - name: swagger.yaml and api.d.ts match the code
        run: |
          make -C notes-go openapi
          (cd notes-app && bun run types)
          git diff --exit-code
      # .env.docker for the API, .env for the interpolation of compose.yaml. Not secrets: a throwaway base.
      - name: Start Postgres, Silo and the API
        working-directory: notes-go
        run: |
          cat > .env.docker <<'ENV'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=password
          POSTGRES_DB=notes
          POSTGRES_HOST=note-postgres
          PORT=5432
          S3_ENDPOINT=note-silo:9000
          S3_ACCESS_KEY=notes
          S3_SECRET_KEY=silo-password-of-the-ci
          S3_BUCKET=notes
          NOTES_SECRET=dGVzdCBrZXkgb2YgdGhlIENJLCBub3QgYSBzZWNyZXQ=
          ENV
          { cat .env.docker; echo WEB_ORIGIN=http://localhost:3000; } > .env
          docker compose --profile api up -d --wait --build postgres silo api
          echo e2e-password | docker exec -i note-api /notes user add e2e --password-stdin
      - name: Start the web app
        working-directory: notes-app
        run: |
          bun --bun run build
          nohup node .output/server/index.mjs > /tmp/notes-app.log 2>&1 &
          curl -fs --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3000
          curl -s --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/api/me
      # The Chrome of the runner, as `channel: 'chrome'` asks: no browser to download.
      - run: bun run e2e
        working-directory: notes-app
      - if: failure()
        working-directory: notes-go
        run: docker compose --profile api logs api; cat /tmp/notes-app.log

  # The image of image.yml, amd64 only and not pushed, run from compose.prod.yaml: a broken Dockerfile shows before the tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/cyril-fl/notes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Not secrets: a throwaway base.
      - name: Start the image with Postgres and Silo
        run: |
          cat > .env <<'ENV'
          NOTES_VERSION=ci
          POSTGRES_USER=app
          POSTGRES_PASSWORD=password
          POSTGRES_DB=notes
          S3_ACCESS_KEY=notes
          S3_SECRET_KEY=silo-password-of-the-ci
          NOTES_SECRET=dGVzdCBrZXkgb2YgdGhlIENJLCBub3QgYSBzZWNyZXQ=
          WEB_ORIGIN=http://localhost:8080
          LIBREDB_ADMIN_PASSWORD=libredb-password-of-the-ci
          LIBREDB_JWT_SECRET=libredb-jwt-secret-of-the-ci-not-a-secret
          ENV
          docker compose -f compose.prod.yaml up -d --wait
      # 401 on /api/me: the API answers, not the web app's fallback page.
      - name: The web app and the API answer
        run: |
          curl -fs --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = 401
      - if: failure()
        run: docker compose -f compose.prod.yaml logs notes

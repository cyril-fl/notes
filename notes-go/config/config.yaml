name: "notes"
commands:
  create:
    use: "add"
    short: "Add a new note, folder, or tag"
    example: "notes add [--note | --folder | --tag] [options]"
  create-note:
    use: "note"
    short: "Add a new note"
    long: "Add a new note. A form opens for the content when --content is not given. The title is the first heading of the content, or its first words."
    example: "notes add note --content \"# Ideas\" --tag go,sql\ncat ideas.md | notes add note --content - --parent /Projects"
    args:
      - name: "content"
        shorthand: "c"
        value: ""
        usage: "Content of the note (- reads it from stdin)"
        type: "string"
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags of the note, comma separated or repeated (unknown tags are created)"
        type: "stringSlice"
      - name: "tag-from-list"
        shorthand: ""
        value: ""
        usage: "Pick tags from the existing ones"
        type: "bool"
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the parent folder"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the parent folder from a list"
        type: "bool"
  create-folder:
    use: "folder"
    short: "Add a new folder"
    long: "Add a new folder. A form opens for the title when --title is not given."
    example: "notes add folder --title \"Projects\" --parent /Work"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "Title of the folder"
        type: "string"
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the parent folder"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the parent folder from a list"
        type: "bool"
  create-tag:
    use: "tag"
    short: "Add a new tag"
  read:
    use: "show"
    short: "Show an existing note, folder, or tag"
  read-note:
    use: "note <uuid|path>"
    short: "Show an existing note"
    long: "Show the path of a note, then its content rendered as markdown."
    example: "notes show note <uuid>\nnotes show note /Projects/Go/Ideas"
  read-folder:
    use: "folder <uuid|path>"
    short: "Show an existing folder"
    long: "Show the title and path of a folder, then its subfolders and notes."
    example: "notes show folder <uuid>\nnotes show folder /Projects --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  read-tag:
    use: "tag [<value>]"
    short: "Show an existing tag"
    long: "Show a tag and the notes carrying it, or every tag with --list (--yaml/--json apply to --list)."
    example: "notes show tag go\nnotes show tag --list --json"
    args:
      - name: "list"
        shorthand: "l"
        value: ""
        usage: "List all tags"
        type: "bool"
      - name: "yaml"
        shorthand: ""
        value: ""
        usage: "Display the result as YAML"
        type: "bool"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  edit:
    use: "edit"
    short: "Edit an existing note, folder, or tag"
  edit-note:
    use: "note <uuid|path>"
    short: "Edit an existing note"
    long: "Edit an existing note. Without content, tag, pin or lock flags, a form opens with the current content. The title follows the first heading of the content, or its first words. --pin or --lock alone leaves the text and its last change date as they are. A locked note refuses content and tag changes until --unlock."
    example: "notes edit note /Projects/Go/Ideas --tag go --untag sql\ncat ideas.md | notes edit note <uuid> --content -\nnotes edit note /Projects/Go/Ideas --pin\nnotes edit note /Projects/Go/Ideas --lock"
    args:
      - name: "content"
        shorthand: "c"
        value: ""
        usage: "New content of the note (- reads it from stdin)"
        type: "string"
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags to add, comma separated or repeated (unknown tags are created)"
        type: "stringSlice"
      - name: "untag"
        shorthand: ""
        value: ""
        usage: "Tags to remove, comma separated or repeated"
        type: "stringSlice"
      - name: "tag-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the tags from the existing ones, current ones checked"
        type: "bool"
      - name: "pin"
        shorthand: ""
        value: ""
        usage: "Pin the note"
        type: "bool"
      - name: "unpin"
        shorthand: ""
        value: ""
        usage: "Unpin the note"
        type: "bool"
      - name: "lock"
        shorthand: ""
        value: ""
        usage: "Lock the note read-only"
        type: "bool"
      - name: "unlock"
        shorthand: ""
        value: ""
        usage: "Unlock the note"
        type: "bool"
  edit-folder:
    use: "folder <uuid|path>"
    short: "Edit an existing folder"
    long: "Edit an existing folder. A form opens with the current title when no flag is given. --pin alone leaves the title as it is."
    example: "notes edit folder <uuid> --title \"Projects\"\nnotes edit folder /Projects --pin"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "New title of the folder"
        type: "string"
      - name: "pin"
        shorthand: ""
        value: ""
        usage: "Make the folder a favorite"
        type: "bool"
      - name: "unpin"
        shorthand: ""
        value: ""
        usage: "Remove the folder from the favorites"
        type: "bool"
  edit-tag:
    use: "tag"
    short: "Edit an existing tag"
  delete:
    use: "remove"
    short: "Delete an existing note, folder, or tag"
  delete-note:
    use: "note"
    short: "Move notes to the trash"
    long: "Move notes to the trash. They are purged for good after the trash retention of the account, 30 days by default."
    example: "notes remove note <uuid|path> [<uuid|path>...]"
  delete-folder:
    use: "folder"
    short: "Move folders and their content to the trash"
    long: "Move folders, their subfolders and notes to the trash. They are purged for good after the trash retention of the account, 30 days by default."
    example: "notes remove folder <uuid|path> [<uuid|path>...]"
  delete-tag:
    use: "tag"
    short: "Delete an existing tag"
  move:
    use: "move <uuid|path>..."
    short: "Move existing notes or folders to a new location"
    long: "Move notes and folders into the folder given by --parent, or to the root without it."
    example: "notes move <uuid> /Inbox/Ideas --parent /Projects"
    args:
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the destination folder (root when not given)"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the destination folder from a list"
        type: "bool"
  show-finder:
    use: "finder [<uuid|path>]"
    short: "Browse folders and notes"
    long: "Browse folders and notes from a folder (the root by default): open, edit, create, delete and filter them."
    example: "notes finder\nnotes finder /Projects"
  show-graph:
    use: "graph [<uuid|path>]"
    short: "Walk the notes linked by [[links]] and the tags they share"
    long: "Center on a note to see its [[links]], its backlinks and the notes sharing its tags, most shared first, and move from note to note. Without a note, start from every note."
    example: "notes graph\nnotes graph /Projects/Go/Ideas"
  trash:
    use: "trash"
    short: "List the removed notes and folders"
    long: "List what was removed, each removal once with what went with it, and when it is purged."
    example: "notes trash\nnotes trash --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  restore:
    use: "restore <uuid>..."
    short: "Take notes and folders out of the trash"
    long: "Take items out of the trash, with everything removed at the same time. An item whose folder is still in the trash cannot come back alone."
    example: "notes restore <uuid> [<uuid>...]"
  search:
    use: "search <text>"
    short: "Find notes by their title or content"
    long: "List the notes whose title or content contains the text (case-insensitive), title matches first. Enter opens a note."
    example: "notes search recette\nnotes search \"pâte brisée\"\nnotes search recette --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  recent:
    use: "recent"
    short: "List the last changed notes"
    long: "List the last changed notes, most recent first. Enter opens a note."
    example: "notes recent\nnotes recent --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  export:
    use: "export <directory> [<uuid|path>]"
    short: "Write notes out as markdown files"
    long: "Write the notes of a folder (all of them without one) into a new or empty directory: a folder becomes a directory, a note a <title>.md file with its text. Links to notes are written back as [[Title]]."
    example: "notes export ~/notes-backup\nnotes export ~/projets /Projects"
  import:
    use: "import <directory>"
    short: "Add markdown files as notes"
    long: "Add every .md file of a directory as a note, and its subdirectories as folders, all or nothing. Hidden files and other files are skipped; a text without a heading gets its file name as title. A folder name already taken in the same place stops the import."
    example: "notes import ~/notes-backup --parent /Archive\nnotes import ~/Obsidian/vault"
    args:
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the folder to import into (root when not given)"
        type: "string"
  serve:
    use: "serve"
    short: "Run the HTTP API"
    long: "Run the HTTP API. It has no authentication: keep it on the loopback. Web pages can only call it from --origin. Accounts are created by invitation of an admin, unless --add-user-mode=public; NOTES_HOST_NAME and NOTES_HOST_PASSWORD create the first account on an empty base."
    example: "notes serve --origin http://localhost:3000"
    args:
      - name: "addr"
        shorthand: ""
        value: "127.0.0.1:8080"
        usage: "Address to listen on"
        type: "string"
      - name: "origin"
        shorthand: ""
        value: ""
        usage: "Origin of the web app allowed to call the API (none when empty)"
        type: "string"
      - name: "web"
        shorthand: ""
        value: ""
        usage: "Folder of the generated web app, served on the same address as the API (none when empty)"
        type: "string"
      - name: "published"
        shorthand: ""
        value: ""
        usage: "Address the API is published on, when not --addr (the host side of a container port): on the loopback, only a local proxy reaches it, and the client's address is read from X-Forwarded-For"
        type: "string"
      - name: "add-user-mode"
        shorthand: ""
        value: "invitation"
        usage: "How accounts are created: invitation (an admin invites or creates them) or public (anyone reaching the web app)"
        type: "string"
  mcp:
    use: "mcp"
    short: "Serve the account's notes to an agent (MCP, stdio)"
    long: "Serve the notes of the logged-in account to an agent over MCP on stdin and stdout: search, read, create and edit. It talks to the database like the rest of the CLI, listens on no port, and acts for the account of this CLI session (notes login)."
    example: "notes mcp"
  login:
    use: "login"
    short: "Log the CLI in to an account"
    long: "Ask the account's name and password, and keep the session in the user's config folder (readable by the user only). Every other command then acts for this account."
    example: "notes login"
  logout:
    use: "logout"
    short: "Log the CLI out"
  user:
    use: "user"
    short: "Manage the accounts (admin, on the server)"
  user-add:
    use: "add <name>"
    short: "Create an account"
    long: "Create an account; the password is asked twice, or read from stdin with --password-stdin."
    example: "notes user add cyril\necho \"$PASSWORD\" | notes user add cyril --password-stdin"
    args:
      - name: "password-stdin"
        shorthand: ""
        value: ""
        usage: "Read the password from the first line of stdin"
        type: "bool"
  reset-password:
    use: "reset-password <name>"
    short: "Give an account a new password (admin, on the server)"
    long: "Give an account a new password, for a forgotten one, and log all its devices out. Run it on the server: it needs access to the base."
    example: "notes reset-password cyril"
    args:
      - name: "password-stdin"
        shorthand: ""
        value: ""
        usage: "Read the password from the first line of stdin"
        type: "bool"
  rotate-secret:
    use: "rotate-secret"
    short: "Seal the keys of the accounts by a new NOTES_SECRET (admin, on the server)"
    long: "Seal the key of every account, sealed by NOTES_OLD_SECRET, by NOTES_SECRET instead. Put the new secret in NOTES_SECRET and the old one in NOTES_OLD_SECRET, after make backup; the notes are not rewritten. Then the same NOTES_SECRET goes in .env.docker, and make api."
    example: "NOTES_OLD_SECRET=<old> notes rotate-secret"
  account:
    use: "account"
    short: "Manage the account logged in"
  account-purge:
    use: "purge"
    short: "Delete every note, folder, tag and image of the account"
    long: "Delete for good every note, folder, tag and image of the account logged in, the trash included. The account and its settings stay. Type the account's name to confirm."
    example: "notes account purge"
  root:
    short: "The root of the notes system"
    long: "The root of the notes system, used to access the main functionality"
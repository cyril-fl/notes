name: "notes"
trash:
  # Deleted notes and folders are purged for good after this many days (0 = never).
  retention-days: 30
commands:
  create:
    use: "add"
    short: "Add a new note, folder, or tag"
    example: "notes add [--note | --folder | --tag] [options]"
  create-note:
    use: "note"
    short: "Add a new note"
    long: "Add a new note. A form opens for the title and content not given by flags."
    example: "notes add note --title \"Ideas\" --content \"...\" --tag go,sql"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "Title of the note"
        type: "string"
      - name: "no-title"
        shorthand: ""
        value: ""
        usage: "Create an untitled note"
        type: "bool"
      - name: "content"
        shorthand: "c"
        value: ""
        usage: "Content of the note"
        type: "string"
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags of the note, comma separated or repeated (unknown tags are created)"
        type: "stringSlice"
      - name: "tag-from-list"
        shorthand: ""
        value: ""
        usage: "Pick tags from the existing ones"
        type: "bool"
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID of the parent folder"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the parent folder from a list (not implemented yet)"
        type: "bool"
  create-folder:
    use: "folder"
    short: "Add a new folder"
    long: "Add a new folder. A form opens for the title when --title is not given."
    example: "notes add folder --title \"Projects\" --parent <uuid>"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "Title of the folder"
        type: "string"
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID of the parent folder"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the parent folder from a list (not implemented yet)"
        type: "bool"
  create-tag:
    use: "tag"
    short: "Add a new tag"
  read:
    use: "show"
    short: "Show an existing note, folder, or tag"
  read-note:
    use: "note"
    short: "Show an existing note"
  read-folder:
    use: "folder"
    short: "Show an existing folder"
  read-tag:
    use: "tag"
    short: "Show an existing tag"
    example: "notes show tag --list --json"
    args:
      - name: "list"
        shorthand: "l"
        value: ""
        usage: "List all tags"
        type: "bool"
      - name: "yaml"
        shorthand: ""
        value: ""
        usage: "Display the result as YAML"
        type: "bool"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  edit:
    use: "edit"
    short: "Edit an existing note, folder, or tag"
  edit-note:
    use: "note <uuid>"
    short: "Edit an existing note"
    long: "Edit an existing note. Without title, content or tag flags, a form opens with the current values."
    example: "notes edit note <uuid> --title \"Ideas\" --tag go --untag sql"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "New title of the note (empty = untitled)"
        type: "string"
      - name: "content"
        shorthand: "c"
        value: ""
        usage: "New content of the note"
        type: "string"
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags to add, comma separated or repeated (unknown tags are created)"
        type: "stringSlice"
      - name: "untag"
        shorthand: ""
        value: ""
        usage: "Tags to remove, comma separated or repeated"
        type: "stringSlice"
      - name: "tag-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the tags from the existing ones, current ones checked"
        type: "bool"
  edit-folder:
    use: "folder <uuid>"
    short: "Edit an existing folder"
    long: "Edit an existing folder. A form opens with the current title when --title is not given."
    example: "notes edit folder <uuid> --title \"Projects\""
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "New title of the folder"
        type: "string"
  edit-tag:
    use: "tag"
    short: "Edit an existing tag"
  delete:
    use: "remove"
    short: "Delete an existing note, folder, or tag"
  delete-note:
    use: "note"
    short: "Move notes to the trash"
    long: "Move notes to the trash. They are purged for good after trash.retention-days."
    example: "notes remove note <uuid> [<uuid>...]"
  delete-folder:
    use: "folder"
    short: "Move folders and their content to the trash"
    long: "Move folders, their subfolders and notes to the trash. They are purged for good after trash.retention-days."
    example: "notes remove folder <uuid> [<uuid>...]"
  delete-tag:
    use: "tag"
    short: "Delete an existing tag"
  move:
    use: "move"
    short: "Move an existing note or folder to a new location"
  finder:
    use: "finder"
    short: "Show a file explorer"
  graph:
    use: "graph"
    short: "Show a graph of the notes linked by their relationships"
  root:
    short: "The root of the notes system"
    long: "The root of the notes system, used to access the main functionality"
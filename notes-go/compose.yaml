services:
  app:
    image: golang:latest
    container_name: note-app
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    env_file:
      - .env.docker
    command: sleep infinity

  postgres:
    image: postgres:18
    container_name: note-postgres
    hostname: note-postgres
    ports:
      - "${PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql

  libredb:
    image: libredb/libredb-studio:latest
    container_name: note-libredb
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_EMAIL: ${LIBREDB_ADMIN_EMAIL:-admin@libredb.org}
      ADMIN_PASSWORD: ${LIBREDB_ADMIN_PASSWORD}
      JWT_SECRET: ${LIBREDB_JWT_SECRET}
      NEXT_PUBLIC_AUTH_PROVIDER: local
      STORAGE_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
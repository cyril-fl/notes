components:
  schemas:
    counttags.TagCount:
      properties:
        notes:
          type: integer
        value:
          type: string
      required:
      - notes
      - value
      type: object
    createfolder.Input:
      properties:
        parent_id:
          type: string
        title:
          type: string
      required:
      - title
      type: object
    createnote.Input:
      properties:
        content:
          type: string
        parent_id:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - content
      type: object
    createsession.Input:
      properties:
        name:
          type: string
        password:
          type: string
      required:
      - name
      - password
      type: object
    createsession.Result:
      properties:
        expires_at:
          type: string
        user:
          $ref: '#/components/schemas/domain.User'
      required:
      - expires_at
      - user
      type: object
    createtag.Body:
      properties:
        values:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - values
      type: object
    domain.File:
      properties:
        content_type:
          type: string
        created_at:
          type: string
        id:
          type: string
        name:
          description: '"" (NULL) for the images uploaded before names were sealed'
          type: string
        size:
          type: integer
      required:
      - content_type
      - created_at
      - id
      - name
      - size
      type: object
    domain.Item:
      properties:
        created_at:
          type: string
        id:
          type: string
        kind:
          $ref: '#/components/schemas/domain.Kind'
        parent_id:
          type: string
        readonly:
          description: a locked note, read by listitems from metadata_notes
          type: boolean
        title:
          description: NULL = untitled note (--no-title)
          type: string
        updated_at:
          type: string
      required:
      - created_at
      - id
      - kind
      - title
      type: object
    domain.Kind:
      enum:
      - folder
      - note
      type: string
      x-enum-varnames:
      - FOLDER
      - NOTE
    domain.NoteVersion:
      properties:
        conflict:
          description: a text refused by a 409, kept so it is not lost (#78)
          type: boolean
        content:
          description: left out of a list
          type: string
        created_at:
          type: string
        id:
          type: string
      required:
      - conflict
      - created_at
      - id
      type: object
    domain.Snippet:
      properties:
        content:
          type: string
        name:
          type: string
      required:
      - content
      - name
      type: object
    domain.Tag:
      properties:
        id:
          type: string
        value:
          type: string
      required:
      - id
      - value
      type: object
    domain.User:
      properties:
        avatar:
          description: the id of a File of the account, purgefiles keeps it
          type: string
        color_mode:
          description: light or dark, one of ColorModes
          type: string
        created_at:
          type: string
        id:
          type: string
        locale:
          description: the language of the web app, one of Locales
          type: string
        name:
          description: unique case-insensitive, see createschema
          type: string
        plan:
          description: the features of the web app, one of Plans
          type: string
        snippets:
          items:
            $ref: '#/components/schemas/domain.Snippet'
          type: array
          uniqueItems: false
        theme:
          description: the colors of the web app, one of Themes
          type: string
        trash_retention_days:
          description: 'Days before the trash is purged, 0 to never purge. An insert
            of 0 gets the default: only an update sets it.'
          type: integer
        view:
          description: how the web app lists items, one of Views
          type: string
      required:
      - avatar
      - color_mode
      - created_at
      - id
      - locale
      - name
      - plan
      - snippets
      - theme
      - trash_retention_days
      - view
      type: object
    editfolder.Body:
      properties:
        pinned:
          type: boolean
        title:
          type: string
      type: object
    editnote.Body:
      properties:
        content:
          type: string
        pinned:
          type: boolean
        readonly:
          type: boolean
        restore:
          description: 'Restore says the content is a version restored: the text it
            replaces is kept in the history.'
          type: boolean
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        updated_at:
          description: 'UpdatedAt is updated_at as read, or created_at for a note
            never edited: a 409 if the note changed since.'
          type: string
      type: object
    editpassword.Input:
      properties:
        current:
          type: string
        new:
          type: string
      required:
      - current
      - new
      type: object
    edittag.Body:
      properties:
        value:
          type: string
      required:
      - value
      type: object
    edituser.Input:
      properties:
        avatar:
          description: the id of an image of the account, "" for none
          type: string
        color_mode:
          type: string
        locale:
          type: string
        name:
          type: string
        plan:
          type: string
        snippets:
          description: the whole list, it replaces the saved one
          items:
            $ref: '#/components/schemas/domain.Snippet'
          type: array
          uniqueItems: false
        theme:
          type: string
        trash_retention_days:
          type: integer
        view:
          type: string
      type: object
    importnotes.Result:
      properties:
        folders:
          type: integer
        notes:
          type: integer
      required:
      - folders
      - notes
      type: object
    listbrokenlinks.Link:
      properties:
        kind:
          enum:
          - unresolved
          - ambiguous
          - missing
          type: string
        note_id:
          type: string
        note_path:
          type: string
        note_title:
          type: string
        target:
          type: string
      required:
      - kind
      - note_id
      - note_path
      - note_title
      - target
      type: object
    listfolders.Folder:
      properties:
        id:
          type: string
        path:
          type: string
      required:
      - id
      - path
      type: object
    listpinned.Pinned:
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/domain.Kind'
        path:
          type: string
        readonly:
          type: boolean
        title:
          type: string
      required:
      - id
      - kind
      - path
      - title
      type: object
    listrecent.Recent:
      properties:
        id:
          type: string
        path:
          type: string
        readonly:
          type: boolean
        title:
          type: string
        updated_at:
          type: string
      required:
      - id
      - path
      - title
      - updated_at
      type: object
    listtrash.Trashed:
      properties:
        deleted_at:
          type: string
        id:
          type: string
        inside:
          type: integer
        kind:
          $ref: '#/components/schemas/domain.Kind'
        title:
          type: string
      required:
      - deleted_at
      - id
      - inside
      - kind
      - title
      type: object
    moveitems.Input:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
        parent_id:
          type: string
      required:
      - ids
      type: object
    readgraph.Link:
      properties:
        linked:
          type: boolean
        source:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        target:
          type: string
      required:
      - linked
      - source
      - tags
      - target
      type: object
    readgraph.Note:
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - title
      type: object
    readgraph.Result:
      properties:
        links:
          items:
            $ref: '#/components/schemas/readgraph.Link'
          type: array
          uniqueItems: false
        notes:
          items:
            $ref: '#/components/schemas/readgraph.Note'
          type: array
          uniqueItems: false
      required:
      - links
      - notes
      type: object
    readitem.Result:
      properties:
        children:
          items:
            $ref: '#/components/schemas/domain.Item'
          type: array
          uniqueItems: false
        content:
          type: string
        item:
          $ref: '#/components/schemas/domain.Item'
        path:
          type: string
        pinned:
          type: boolean
        readonly:
          description: 'locked: PATCH refuses its content and tags'
          type: boolean
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - item
      - path
      type: object
    readneighbors.Linked:
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - title
      type: object
    readneighbors.Neighbor:
      properties:
        id:
          type: string
        path:
          type: string
        shared:
          type: integer
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
      required:
      - id
      - path
      - shared
      - tags
      - title
      type: object
    readneighbors.Result:
      properties:
        backlinks:
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
        links:
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
        neighbors:
          items:
            $ref: '#/components/schemas/readneighbors.Neighbor'
          type: array
          uniqueItems: false
        note:
          $ref: '#/components/schemas/readitem.Result'
      required:
      - backlinks
      - links
      - neighbors
      - note
      type: object
    readtag.Note:
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - title
      type: object
    readtag.Result:
      properties:
        notes:
          items:
            $ref: '#/components/schemas/readtag.Note'
          type: array
          uniqueItems: false
        tag:
          $ref: '#/components/schemas/domain.Tag'
      required:
      - notes
      - tag
      type: object
    readversions.Body:
      properties:
        content:
          type: string
      required:
      - content
      type: object
    respond.Failure:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    restore.Body:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    searchnotes.Match:
      properties:
        id:
          type: string
        path:
          type: string
        readonly:
          type: boolean
        snippet:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - snippet
      - title
      type: object
externalDocs:
  description: ""
  url: ""
info:
  title: Notes API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/export:
    get:
      parameters:
      - description: items to export with what they hold, every note when left out
        in: query
        name: id
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: file
          description: OK
        "400":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "404":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
        "500":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Export the notes as markdown files
      tags:
      - transfer
  /api/files:
    post:
      parameters:
      - description: file name
        in: query
        name: name
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: integer
              title: body
              type: array
          image/gif:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              type: string
          image/png:
            schema:
              format: binary
              type: string
          image/webp:
            schema:
              type: string
        description: image
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.File'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unsupported Media Type
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Upload an image
      tags:
      - files
  /api/files/{id}:
    get:
      parameters:
      - description: uuid
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/gif:
              schema:
                type: file
            image/jpeg:
              schema:
                type: file
            image/png:
              schema:
                type: file
            image/webp:
              schema:
                type: file
          description: OK
        "404":
          content:
            image/gif:
              schema:
                $ref: '#/components/schemas/respond.Failure'
            image/jpeg:
              schema:
                $ref: '#/components/schemas/respond.Failure'
            image/png:
              schema:
                $ref: '#/components/schemas/respond.Failure'
            image/webp:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
        "500":
          content:
            image/gif:
              schema:
                $ref: '#/components/schemas/respond.Failure'
            image/jpeg:
              schema:
                $ref: '#/components/schemas/respond.Failure'
            image/png:
              schema:
                $ref: '#/components/schemas/respond.Failure'
            image/webp:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Read an image
      tags:
      - files
  /api/folders:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/listfolders.Folder'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: List every folder with its path
      tags:
      - folders
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createfolder.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Item'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Request Entity Too Large
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Create a folder
      tags:
      - folders
  /api/folders/{id}:
    delete:
      parameters:
      - description: uuid
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Move a folder and its content to the trash
      tags:
      - folders
    get:
      parameters:
      - description: uuid
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/readitem.Result'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Read a folder and its direct children
      tags:
      - folders
    patch:
      parameters:
      - description: uuid
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/editfolder.Body'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Item'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Request Entity Too Large
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Rename a folder, or make it a favorite
      tags:
      - folders
  /api/graph:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/counttags.TagCount'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Count the notes of every tag, most used first
      tags:
      - graph
  /api/graph/notes:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/readgraph.Result'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Read every note and the links between those sharing tags
      tags:
      - graph
  /api/import:
    post:
      parameters:
      - description: folder uuid, the root when left out
        in: query
        name: parent
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: integer
              title: body
              type: array
          application/zip:
            schema:
              format: binary
              type: string
          multipart/form-data:
            schema:
              type: object
        description: zip of .md files and their images, or a form of files named by
          their path
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importnotes.Result'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Request Entity Too Large
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Import markdown files from a zip or a form of files
      tags:
      - transfer
  /api/items:
    get:
      parameters:
      - description: folder uuid, the root when left out
        in: query
        name: parent
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.Item'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: List the direct children of a folder, or of the root
      tags:
      - items
  /api/links/broken:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/listbrokenlinks.Link'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: List the broken and ambiguous links
      tags:
      - graph
  /api/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createsession.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createsession.Result'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Log in
      tags:
      - account
  /api/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Log out
      tags:
      - account
  /api/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.User'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Unauthorized
      summary: The account logged in
      tags:
      - account
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/edituser.Input'
              description: body
              summary: body
        description: body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.User'
          description: OK
        "400":
          content:
            application/json:
              schema:

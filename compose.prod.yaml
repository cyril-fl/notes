# The server: `docker compose -f compose.prod.yaml up -d`, with a .env next to it (see .env.prod.example).
# Update: `docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d`.
services:
  notes:
    image: ghcr.io/cyril-fl/notes:${NOTES_VERSION:-latest}
    container_name: note-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: note-postgres
      PORT: 5432
      S3_ENDPOINT: note-silo:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-notes}
      NOTES_SECRET: ${NOTES_SECRET:?set NOTES_SECRET in .env}
      CONFIG_FILE: ""
    # The address the browser types: requests from any other page are refused.
    command: serve --addr :8080 --web /web --origin=${WEB_ORIGIN:?set WEB_ORIGIN in .env}
    # Plain HTTP, and the session cookie needs HTTPS: a proxy in front gives it.
    ports:
      - "${NOTES_LISTEN:-127.0.0.1:8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: note-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: note-silo
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - silo-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  silo-data:
